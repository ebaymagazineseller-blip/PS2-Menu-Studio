name: Build Windows app
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller py7zr
      - run: pyinstaller --onefile --windowed --collect-all py7zr --name PS2MenuStudio ps2_menu_studio.py
      - uses: actions/upload-artifact@v4
        with:
          name: PS2MenuStudio-Windows
          path: dist/PS2MenuStudio.exe
